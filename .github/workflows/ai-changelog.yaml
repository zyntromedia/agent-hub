name: AI Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: git log -n 10 needs more than the default depth-1 clone

      - name: Generate changelog
        run: node .github/scripts/generate-changelog.js

      - name: Commit docs
        run: |
          git config user.name "ai-doc-bot"
          git config user.email "bot@crystalcastle.dev"
          git add docs/CHANGELOG.md
          git commit -m "docs: auto update changelog" || exit 0
          git push


name: API Security Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: api-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test API Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run security tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          INTERNAL_API_KEY: ci-test-placeholder
          NEXT_TELEMETRY_DISABLED: "1"

name: Docker CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json not found — commit it, or set working-directory if app is in a subfolder"
            exit 1
          fi
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund --loglevel=error && break
            echo "Attempt $attempt failed, retrying in 5s…"
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit 1
            fi
          done

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json not found — commit it, or set working-directory if app is in a subfolder"
            exit 1
          fi
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund --loglevel=error && break
            echo "Attempt $attempt failed, retrying in 5s…"
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit 1
            fi
          done

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json not found — commit it, or set working-directory if app is in a subfolder"
            exit 1
          fi
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund --loglevel=error && break
            echo "Attempt $attempt failed, retrying in 5s…"
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit 1
            fi
          done

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          # Pass build-time env vars here, e.g.:
          # VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify build output
        run: |
          if [ ! -d dist ] && [ ! -d build ] && [ ! -d .next ]; then
            echo "::error::Build output not found (expected dist/, build/, or .next/)"
            exit 1
          fi
          echo "Build output size:"
          du -sh dist build .next 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: |
            dist/
            build/
            .next/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - test
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

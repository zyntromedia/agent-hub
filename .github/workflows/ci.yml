name: Obsidian Vault CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Markdown
        run: |
          find . -name "*.md" -print0 |
          xargs -0 -n1 test -s

      - name: Validate JSON
        run: |
          find . -name "*.json" -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done

      - name: Check broken Git state
        run: git status --short
